# Local Supabase stack (`supabase start`). Hosted projects take these from the dashboard.
project_id = "family-expenses"

[api]
schemas = ["public"]

[auth]
site_url = "app.familyexpenses://login-callback"
additional_redirect_urls = ["app.familyexpenses://login-callback"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6
otp_expiry = 3600

[functions.create-invite]
verify_jwt = true

[functions.redeem-invite]
verify_jwt = true

[functions.sheets-connect]
verify_jwt = true

# Google calls this one from the browser, without a bearer token. It is protected by the
# single-use `state` row created for the signed-in owner.
[functions.sheets-callback]
verify_jwt = false

# The scheduled call carries a shared secret; "Sync now" carries the user's token. Both are
# checked inside the function.
[functions.sheets-sync]
verify_jwt = false
