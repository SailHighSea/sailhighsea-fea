name: Build

# Builds Windows, Android, macOS and Linux on GitHub's machines, so nothing has to be
# installed on your PC. Every push to main also refreshes the "latest" release with all the
# files. Run it by hand from the Actions tab ("Run workflow") if you like.
#
# Google Sheets mode is the default. Add repository secrets GOOGLE_CLIENT_ID and
# GOOGLE_CLIENT_SECRET (docs/GOOGLE_SETUP.md) so Google sign-in works in these builds.
#
# Supabase (only with BACKEND=supabase): add repository secrets SUPABASE_URL and SUPABASE_ANON_KEY (Settings, Secrets and
# variables, Actions). Without them the builds are local-only (no sign-in). Never commit
# .env.json.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  windows:
    name: Windows ${{ matrix.arch }} (analyze, test, build)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, arch: x64 }
          # Windows Arm64 is not built: subosito/flutter-action cannot find a Flutter 3.47.8
          # release for Windows on arm64 ("Unable to determine Flutter version"). To add it, set up
          # Flutter by hand on windows-11-arm (see docs/RELEASE.md).
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - if: matrix.arch == 'x64'
        run: flutter analyze
      # Golden images were made on Windows, so tests run here and not on Linux.
      - if: matrix.arch == 'x64'
        run: flutter test tests/

      - name: Write .env.json
        shell: pwsh
        run: |
          @{ SUPABASE_URL = $env:SUPABASE_URL; SUPABASE_ANON_KEY = $env:SUPABASE_ANON_KEY; GOOGLE_CLIENT_ID = $env:GOOGLE_CLIENT_ID; GOOGLE_CLIENT_SECRET = $env:GOOGLE_CLIENT_SECRET } | ConvertTo-Json | Set-Content .env.json

      - name: Build Windows release
        run: flutter build windows --release --dart-define-from-file=.env.json

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build\windows\${{ matrix.arch }}\runner\Release\* -DestinationPath windows-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: windows-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Keep golden diffs when tests fail
        if: failure() && matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: tests/**/failures/
          if-no-files-found: ignore

  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Write .env.json
        run: |
          printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s","GOOGLE_CLIENT_ID":"%s","GOOGLE_CLIENT_SECRET":"%s"}' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" > .env.json

      # A stable signing key makes each new APK install over the old one as an update (and keep its
      # data). Add the four ANDROID_* secrets (docs/ANDROID_SIGNING.md); without them the APK is signed
      # with a throwaway debug key and has to be uninstalled before the next one can be installed.
      - name: Set up the release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/key.properties
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this APK is signed with a debug key and cannot update an installed copy."
          fi

      # The build number goes up on every run: Android only installs an update with a higher number.
      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define-from-file=.env.json

      - run: cp build/app/outputs/flutter-apk/app-release.apk family-expenses.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: family-expenses.apk
          if-no-files-found: error

  macos:
    name: macOS app (dmg)
    runs-on: macos-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Write .env.json
        run: |
          printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s","GOOGLE_CLIENT_ID":"%s","GOOGLE_CLIENT_SECRET":"%s"}' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" > .env.json

      - name: Build macOS release
        run: flutter build macos --release --dart-define-from-file=.env.json

      # iOS: built without code signing, so it proves the target compiles. A signed build for
      # TestFlight needs the Apple certificates (docs/RELEASE.md).
      - name: Build iOS (no code signing)
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=.env.json
          ditto -c -k --keepParent build/ios/iphoneos/Runner.app family-expenses-ios-unsigned.zip

      # Unsigned: on first open, right-click the app and choose Open.
      - name: Make dmg
        run: |
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          hdiutil create -volname "Family Expenses" -srcfolder "$APP" -ov -format UDZO family-expenses-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: family-expenses-macos.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: family-expenses-ios-unsigned.zip
          if-no-files-found: error

  linux:
    name: Linux bundle
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Write .env.json
        run: |
          printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s","GOOGLE_CLIENT_ID":"%s","GOOGLE_CLIENT_SECRET":"%s"}' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" > .env.json

      - name: Build Linux release
        run: flutter build linux --release --dart-define-from-file=.env.json

      - run: tar -czf family-expenses-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Make the .deb
        run: bash scripts/package_linux.sh deb build/linux/x64/release/bundle

      # AppImage needs a download of appimagetool, so it never blocks the build.
      - name: Make the AppImage
        continue-on-error: true
        run: bash scripts/package_linux.sh appimage build/linux/x64/release/bundle

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            family-expenses-linux-x64.tar.gz
            family-expenses_*.deb
            Family_Expenses-*.AppImage
          if-no-files-found: error

  release:
    name: Publish "latest" release
    needs: [windows, android, macos, linux]
    # Only for pushes to main, never for pull requests.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Replace the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/* --target "$GITHUB_SHA" --prerelease \
            --title "Latest build ($(echo $GITHUB_SHA | cut -c1-7))" \
            --notes "Built from commit $GITHUB_SHA. Windows: unzip and run family_expenses.exe. macOS: open the dmg, then right-click the app and choose Open (unsigned). Linux: extract the tar.gz and run the family_expenses binary. Android: install the apk (allow unknown sources)."
