name: Build

# Builds Windows, Android, macOS and Linux on GitHub's machines, so nothing has to be
# installed on your PC. Every push to main also refreshes the "latest" release with all the
# files. Run it by hand from the Actions tab ("Run workflow") if you like.
#
# Supabase: add repository secrets SUPABASE_URL and SUPABASE_ANON_KEY (Settings, Secrets and
# variables, Actions). Without them the builds are local-only (no sign-in). Never commit
# .env.json.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  windows:
    name: Windows ${{ matrix.arch }} (analyze, test, build)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, arch: x64 }
          # Arm64 builds on GitHub's Windows 11 Arm runner. Not verified yet, so it never blocks
          # the other builds (see docs/RELEASE.md).
          - { os: windows-11-arm, arch: arm64 }
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - if: matrix.arch == 'x64'
        run: flutter analyze
      # Golden images were made on Windows, so tests run here and not on Linux.
      - if: matrix.arch == 'x64'
        run: flutter test tests/

      - name: Write .env.json
        shell: pwsh
        run: |
          if ($env:SUPABASE_URL) {
            @{ SUPABASE_URL = $env:SUPABASE_URL; SUPABASE_ANON_KEY = $env:SUPABASE_ANON_KEY } | ConvertTo-Json | Set-Content .env.json
          } else { '{}' | Set-Content .env.json }

      - name: Build Windows release
        run: flutter build windows --release --dart-define-from-file=.env.json

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build\windows\${{ matrix.arch }}\runner\Release\* -DestinationPath windows-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: windows-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Keep golden diffs when tests fail
        if: failure() && matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: tests/**/failures/
          if-no-files-found: ignore

  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Write .env.json
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s"}' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env.json
          else echo '{}' > .env.json; fi

      - name: Build release APK
        run: flutter build apk --release --dart-define-from-file=.env.json

      - run: cp build/app/outputs/flutter-apk/app-release.apk family-expenses.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: family-expenses.apk
          if-no-files-found: error

  macos:
    name: macOS app (dmg)
    runs-on: macos-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Write .env.json
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s"}' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env.json
          else echo '{}' > .env.json; fi

      - name: Build macOS release
        run: flutter build macos --release --dart-define-from-file=.env.json

      # iOS: built without code signing, so it proves the target compiles. A signed build for
      # TestFlight needs the Apple certificates (docs/RELEASE.md).
      - name: Build iOS (no code signing)
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=.env.json
          ditto -c -k --keepParent build/ios/iphoneos/Runner.app family-expenses-ios-unsigned.zip

      # Unsigned: on first open, right-click the app and choose Open.
      - name: Make dmg
        run: |
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          hdiutil create -volname "Family Expenses" -srcfolder "$APP" -ov -format UDZO family-expenses-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: family-expenses-macos.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: family-expenses-ios-unsigned.zip
          if-no-files-found: error

  linux:
    name: Linux bundle
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Write .env.json
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s"}' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env.json
          else echo '{}' > .env.json; fi

      - name: Build Linux release
        run: flutter build linux --release --dart-define-from-file=.env.json

      - run: tar -czf family-expenses-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Make the .deb
        run: bash scripts/package_linux.sh deb build/linux/x64/release/bundle

      # AppImage needs a download of appimagetool, so it never blocks the build.
      - name: Make the AppImage
        continue-on-error: true
        run: bash scripts/package_linux.sh appimage build/linux/x64/release/bundle

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            family-expenses-linux-x64.tar.gz
            family-expenses_*.deb
            Family_Expenses-*.AppImage
          if-no-files-found: error

  release:
    name: Publish "latest" release
    needs: [windows, android, macos, linux]
    # Only for pushes to main, never for pull requests.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Replace the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/* --target "$GITHUB_SHA" --prerelease \
            --title "Latest build ($(echo $GITHUB_SHA | cut -c1-7))" \
            --notes "Built from commit $GITHUB_SHA. Windows: unzip and run family_expenses.exe. macOS: open the dmg, then right-click the app and choose Open (unsigned). Linux: extract the tar.gz and run the family_expenses binary. Android: install the apk (allow unknown sources)."
