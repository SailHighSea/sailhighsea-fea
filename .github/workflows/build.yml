name: Build

# Builds the Windows exe and the Android APK on GitHub's machines, so nothing has to be
# installed on your PC. Run it from the Actions tab ("Run workflow") or push to main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  windows:
    name: Windows exe (analyze, test, build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      # Golden images were made on Windows, so tests run here and not on Linux.
      - run: flutter test tests/

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: windows-x64.zip
          if-no-files-found: error

      - name: Keep golden diffs when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: tests/**/failures/
          if-no-files-found: ignore

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Supabase keys are not needed until Phase 3. Later, add them as repository secrets
      # and pass --dart-define; never commit .env.json.
      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
