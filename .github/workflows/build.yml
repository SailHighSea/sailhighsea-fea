name: Build

# Builds Windows and Android on GitHub's machines (macOS and Linux only when run by hand, for
# now), so nothing has to be installed on your PC. Every push to main also refreshes the "latest"
# test release. Run it by hand from the Actions tab ("Run workflow") to build everything.
#
# Google Sheets mode is the default. Add repository secrets GOOGLE_CLIENT_ID and
# GOOGLE_CLIENT_SECRET (docs/GOOGLE_SETUP.md) so Google sign-in works in these builds.
#
# Supabase (only with BACKEND=supabase): add repository secrets SUPABASE_URL and SUPABASE_ANON_KEY (Settings, Secrets and
# variables, Actions). Without them the builds are local-only (no sign-in). Never commit
# .env.json.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  windows:
    name: Windows ${{ matrix.arch }} (analyze, test, build)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, arch: x64 }
          # Windows Arm64 is not built: subosito/flutter-action cannot find a Flutter 3.47.8
          # release for Windows on arm64 ("Unable to determine Flutter version"). To add it, set up
          # Flutter by hand on windows-11-arm (see docs/RELEASE.md).
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - if: matrix.arch == 'x64'
        run: flutter analyze
      # Golden images were made on Windows, so tests run here and not on Linux.
      - if: matrix.arch == 'x64'
        run: flutter test tests/

      - name: Write .env.json
        shell: pwsh
        run: |
          @{ SUPABASE_URL = $env:SUPABASE_URL; SUPABASE_ANON_KEY = $env:SUPABASE_ANON_KEY; GOOGLE_CLIENT_ID = $env:GOOGLE_CLIENT_ID; GOOGLE_CLIENT_SECRET = $env:GOOGLE_CLIENT_SECRET } | ConvertTo-Json | Set-Content .env.json

      - name: Build Windows release
        # Debug symbols are split out of the app: a smaller download, the same behaviour.
        run: flutter build windows --release --split-debug-info=build/symbols --dart-define-from-file=.env.json

      - name: Zip
        shell: pwsh
        # 7-Zip at maximum is smaller than Compress-Archive (about 10 to 20 percent) and the file is
        # still an ordinary zip that Windows opens.
        run: |
          $src = ".\build\windows\${{ matrix.arch }}\runner\Release"
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            7z a -tzip -mx=9 -mfb=258 -mpass=15 windows-${{ matrix.arch }}.zip "$src\*"
          } else {
            Compress-Archive -Path "$src\*" -DestinationPath windows-${{ matrix.arch }}.zip
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: windows-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Keep golden diffs when tests fail
        if: failure() && matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: tests/**/failures/
          if-no-files-found: ignore

  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Write .env.json
        run: |
          printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s","GOOGLE_CLIENT_ID":"%s","GOOGLE_CLIENT_SECRET":"%s"}' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" > .env.json

      # A stable signing key makes each new APK install over the old one as an update (and keep its
      # data). Add the four ANDROID_* secrets (docs/ANDROID_SIGNING.md); without them the APK is signed
      # with a throwaway debug key and has to be uninstalled before the next one can be installed.
      - name: Set up the release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/key.properties
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this APK is signed with a debug key and cannot update an installed copy."
          fi

      # The build number goes up on every run: Android only installs an update with a higher number.
      - name: Build release APK
        # One APK per processor type is about a third the size of the universal one. Debug symbols
        # are split out of the app (smaller download, same behaviour).
        run: flutter build apk --release --split-per-abi --split-debug-info=build/symbols --build-number=${{ github.run_number }} --dart-define-from-file=.env.json

      # arm64 is every phone made since about 2017; armv7 is for older ones.
      - run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk family-expenses.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk family-expenses-older-phones.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            family-expenses.apk
            family-expenses-older-phones.apk
          if-no-files-found: error

      # Google Play takes an app bundle (.aab), not an APK. Same signing key and build number.
      - name: Build app bundle for Google Play
        run: flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define-from-file=.env.json

      - uses: actions/upload-artifact@v4
        with:
          name: android-play-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  # macOS and Linux are paused for now: only Android and Windows are released for testing. Run the
  # workflow by hand ("Run workflow") to build them too.
  macos:
    name: macOS app (dmg)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Write .env.json
        run: |
          printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s","GOOGLE_CLIENT_ID":"%s","GOOGLE_CLIENT_SECRET":"%s"}' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" > .env.json

      - name: Build macOS release
        run: flutter build macos --release --split-debug-info=build/symbols --dart-define-from-file=.env.json

      # iOS: built without code signing, so it proves the target compiles. A signed build for
      # TestFlight needs the Apple certificates (docs/RELEASE.md).
      - name: Build iOS (no code signing)
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=.env.json
          ditto -c -k --keepParent build/ios/iphoneos/Runner.app family-expenses-ios-unsigned.zip

      # Unsigned: on first open, right-click the app and choose Open.
      - name: Make dmg
        run: |
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          hdiutil create -volname "FET Family Expenses Tracker" -srcfolder "$APP" -ov -format ULMO family-expenses-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: family-expenses-macos.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: family-expenses-ios-unsigned.zip
          if-no-files-found: error

  linux:
    name: Linux bundle
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Write .env.json
        run: |
          printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s","GOOGLE_CLIENT_ID":"%s","GOOGLE_CLIENT_SECRET":"%s"}' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" > .env.json

      - name: Build Linux release
        run: flutter build linux --release --split-debug-info=build/symbols --dart-define-from-file=.env.json

      # xz makes the archive about a quarter smaller than gzip.
      - run: tar -cJf family-expenses-linux-x64.tar.xz -C build/linux/x64/release/bundle .

      - name: Make the .deb
        run: bash scripts/package_linux.sh deb build/linux/x64/release/bundle

      # AppImage needs a download of appimagetool, so it never blocks the build.
      - name: Make the AppImage
        continue-on-error: true
        run: bash scripts/package_linux.sh appimage build/linux/x64/release/bundle

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            family-expenses-linux-x64.tar.xz
            family-expenses_*.deb
            Family_Expenses-*.AppImage
          if-no-files-found: error

  release:
    name: Publish a test release (v0.0.1-devN)
    needs: [windows, android]
    # Only for pushes to main, never for pull requests.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One release at a time, so two quick pushes never pick the same number.
    concurrency: release-dev
    permissions:
      contents: write
    env:
      # The version being tested. Change it when the next version starts; the dev number restarts.
      BASE_VERSION: 0.0.1
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the next dev release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          # The next number after the highest v<base>-dev<N> release that exists: dev1, dev2, ...
          LAST=$(gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | sed -n "s/^v${BASE_VERSION}-dev\([0-9][0-9]*\)$/\1/p" | sort -n | tail -1)
          N=$(( ${LAST:-0} + 1 ))
          TAG="v${BASE_VERSION}-dev${N}"
          echo "Publishing $TAG"
          # Only the files people install: the Play bundle (.aab) stays an Actions artifact.
          FILES=$(ls dist/*.apk dist/*.zip dist/*.dmg dist/*.tar.xz dist/*.deb dist/*.AppImage 2>/dev/null || true)
          gh release create "$TAG" $FILES --target "$GITHUB_SHA" --prerelease \
            --title "$TAG" \
            --notes "Test build $TAG from commit $GITHUB_SHA. For testing: Android and Windows only. Windows: unzip and run family_expenses.exe. Android: install family-expenses.apk (allow unknown sources); family-expenses-older-phones.apk is only for phones from before about 2017. macOS and Linux builds are paused. Earlier test builds stay under Releases."
