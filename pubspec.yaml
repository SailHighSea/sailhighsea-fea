name: family_expenses
description: "Family Expense Tracker: a shared monthly household budget."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  supabase_flutter: ^2.18.3
  fl_chart: ^1.3.0
  local_auth: ^3.0.2
  intl: ^0.20.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^0.17.1
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
  fonts:
    # DM Sans (SIL OFL, see assets/fonts/OFL.txt). Variable font: weight axis follows FontWeight.
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0F6B4F"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  macos:
    generate: true
  windows:
    generate: true
    icon_size: 256
